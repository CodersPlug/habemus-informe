name: Informe Habemus

on:
  schedule:
    # 09:00 ART, lunes a viernes
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el informe
        env:
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "X-API-Key: $KAPSO_API_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: HabemusInformeCron/1.0" \
            --data '{"input":{"send":true,"force":false}}' \
            https://api.kapso.ai/platform/v1/functions/75fca26c-c671-4546-9a79-063651c073d1/invoke \
            -o /tmp/informe.json
          python3 - << 'PY'
          import json
          data = json.load(open("/tmp/informe.json"))
          payload = data.get("data") or data
          if isinstance(payload, dict) and "output" in payload and isinstance(payload["output"], dict):
              payload = payload["output"]
          html = payload.get("html") if isinstance(payload, dict) else None
          if not html:
              raise SystemExit("sin html: " + json.dumps(data)[:500])
          open("index.html", "w").write(html)
          print(payload.get("reportText", ""))
          wa = payload.get("whatsapp")
          print("whatsapp", json.dumps(wa)[:300] if wa else "no enviado")
          PY
      - name: Publicar la página
        run: |
          git config user.name "Habemus informe"
          git config user.email "codersplug@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "Actualizar informe Habemus"
            git push
          fi
